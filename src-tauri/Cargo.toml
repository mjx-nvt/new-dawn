[package]
name = "new-dawn"
version = "0.1.0"
description = "New Dawn — a local-first personal workspace for people who work across several companies."
authors = ["Tien Nguyen"]
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name (Windows quirk).
name = "new_dawn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Added per phase (see docs/playbook.md). Keep this list honest: add a crate
#    in the prompt that first needs it, and check its current API on docs.rs. ──
# P1.1  window-vibrancy
# P1.2  sqlx (runtime-tokio, sqlite, uuid, chrono), uuid (v7), tokio, anyhow, thiserror,
#       tracing, tracing-subscriber, tauri-specta, specta, trash
# P1.3  tauri-plugin-global-shortcut
# P3a   reqwest (json, stream), futures-util, sysinfo
# P3b   whisper-rs (metal), silero_rs (git), symphonia, rubato, sha2
# P3c   cpal, cidre, ebur128, ringbuf

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
