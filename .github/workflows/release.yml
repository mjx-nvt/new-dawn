# Builds New Dawn for Apple Silicon and publishes the .dmg plus the signed update bundle and
# latest.json as a GitHub release of this (public) repo; the app's updater reads latest.json.
# Releases are normally published from the Mac with scripts/release-local.sh (D-031). This workflow
# is the fallback for when the Mac is off: Actions → Release → Run workflow, pick the tag (e.g.
# v0.7.4) under "Use workflow from", then approve the run (Review deployments). Use one path per
# version, never both. Hardening: the signing key exists only as a secret of the `release`
# environment, which needs the owner's approval for every run and accepts only v* tags; every
# action is pinned to an exact commit (update the SHAs on purpose, not by a moving tag).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A run from a branch (the form's default, main) would only meet the environment's refusal;
  # say plainly what to pick instead, before anything else happens.
  tag-only:
    runs-on: ubuntu-latest
    steps:
      - name: Started from a version tag?
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Start this from a version tag, not the branch '${{ github.ref_name }}': Run workflow → Use workflow from → Tags → the new version (e.g. v0.7.4). Tags up to v0.7.3 predate this workflow and can't be used."
          exit 1

  build:
    needs: tag-only
    runs-on: macos-15
    environment: release # the key lives here; each run waits for the owner's approval
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Tag must match the app version (else the updater never offers it)
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "v$version" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} != v$version"; exit 1; }

      # The updater key: Tauri wants the key file's content, which is one base64 line (it starts
      # with "dW50cnVzdGVk" = "untrusted comment:" encoded). Accept the decoded two-line form too,
      # strip stray whitespace, and stop here — not after an 11-minute build — when it's missing.
      - name: Check the updater signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          key=$(printf '%s' "$KEY" | tr -d '[:space:]')
          if [ -z "$key" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. On the Mac that holds the key: gh secret set TAURI_SIGNING_PRIVATE_KEY --repo ${{ github.repository }} < ~/.tauri/newdawn.key"
            exit 1
          fi
          case "$key" in
            dW50cnVzdGVk*) ;;                                   # already the base64 file content
            *) key=$(printf '%s' "$KEY" | base64 | tr -d '\n') ;; # decoded form pasted: encode it
          esac
          printf '%s' "$key" | base64 --decode | head -c 18 | grep -q '^untrusted comment' \
            || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not a Tauri updater key (expected the content of ~/.tauri/newdawn.key)"; exit 1; }
          echo "::add-mask::$key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"

      - name: Build and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "New Dawn ${{ github.ref_name }}"
          releaseBody: "See the commit history for what changed."
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
